    </pattern>
    <mask id="exactDroneShape" maskUnits="userSpaceOnUse" x="0" y="0" width="700" height="520">
      <image href="../images/drones/noun-agricultural-drone-clean.png" width="700" height="520"/>
    </mask>
  </defs>

  <rect width="760" height="520" rx="28" fill="url(#bg)"/>
  <rect width="760" height="520" rx="28" fill="url(#grid)"/>

