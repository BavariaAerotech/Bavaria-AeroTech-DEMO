<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Pilot branches to Green Hub system map</title>
  <desc id="desc">Hydroponics and agricultural drone services converge into a pilot operation and a future Green Hub.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0d253c"/>
      <stop offset="1" stop-color="#102c27"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
